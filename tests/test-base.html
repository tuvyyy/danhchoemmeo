
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 100vw; height: 100vh;
    background: #16070b;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .envelope-box {
    position: relative;
    width: 84vw;
    aspect-ratio: 1448 / 1086;
    max-height: 80vh;
  }
  .full {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
</style>
</head>
<body>
  <div class="envelope-box">
    <!-- Liner -->
    <img class="full" style="z-index: 1;" src="http://localhost:3333/assets/envelope-voucher/04_envelope_inner_liner.png" />
    <!-- Pocket -->
    <img class="full" style="z-index: 10;" src="http://localhost:3333/assets/envelope-voucher/03_envelope_bottom_pocket.png" />
  </div>
</body>
</html>

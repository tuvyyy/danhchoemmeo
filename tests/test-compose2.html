
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 100vw; height: 100vh;
    background: radial-gradient(ellipse 110% 90% at 50% 45%, #230810 0%, #150308 55%, #0a0104 100%);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: serif;
    color: #cbb085;
  }

  .chapter-header {
    text-align: center;
    margin-bottom: 8px;
    z-index: 50;
  }
  .chapter-title {
    font-size: 13px;
    letter-spacing: 0.38em;
    font-family: 'Cinzel', 'Playfair Display', serif;
    color: #d4af72;
    opacity: 0.9;
  }
  .chapter-star {
    display: block;
    font-size: 10px;
    color: #d4af72;
    margin-top: 3px;
    opacity: 0.8;
  }

  /* Envelope scene container: 86vw, 76vh, max 1440x810 */
  .envelope-scene {
    position: relative;
    width: 86vw;
    max-width: 1440px;
    height: 74vh;
    max-height: 760px;
    aspect-ratio: 1672 / 941;
  }

  .layer {
    position: absolute;
    user-select: none;
  }

  /* 2. Top flap */
  .layer-top-flap {
    left: 0;
    top: -6%;
    width: 100%;
    height: 48%;
    object-fit: fill;
    z-index: 2;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.55));
  }

  /* 3. Ivory inner liner */
  .layer-inner-liner {
    left: 2%;
    top: 4%;
    width: 96%;
    height: 86%;
    object-fit: fill;
    z-index: 3;
    border-radius: 4px;
    clip-path: inset(0 0 12% 0);
  }

  /* 4. Handwritten letter */
  .layer-letter {
    left: 7%;
    top: 15%;
    width: 38%;
    height: auto;
    transform: rotate(-3.5deg);
    z-index: 10;
    filter: drop-shadow(0 14px 28px rgba(0,0,0,0.42));
    transition: transform 0.3s ease;
  }
  .layer-letter:hover {
    transform: rotate(-2.5deg) translateY(-8px);
  }

  /* 5. Voucher Fan */
  .voucher-group {
    position: absolute;
    left: 44%;
    top: 8%;
    width: 53%;
    height: 78%;
    z-index: 12;
  }
  .voucher-card {
    position: absolute;
    width: 29%;
    height: auto;
    filter: drop-shadow(0 12px 24px rgba(0,0,0,0.38));
    transform-origin: 50% 90%;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.3s ease, z-index 0.3s step-end;
  }
  .voucher-card:hover {
    transform: translateY(-16px) scale(1.03) !important;
    filter: drop-shadow(0 20px 36px rgba(0,0,0,0.55)) brightness(1.05);
    z-index: 40 !important;
  }
  .voucher-1 { left: 1%;  top: 22%; transform: rotate(-7deg); z-index: 1; }
  .voucher-2 { left: 23%; top: 9%;  transform: rotate(-2deg); z-index: 4; }
  .voucher-3 { left: 50%; top: 20%; transform: rotate(3deg);  z-index: 3; }
  .voucher-4 { left: 73%; top: 24%; transform: rotate(7deg);  z-index: 2; }

  /* 6. Bottom Burgundy Pocket */
  .layer-bottom-pocket {
    left: 0;
    bottom: -3%;
    width: 100%;
    height: 58%;
    object-fit: fill;
    z-index: 20;
    pointer-events: none;
    filter: drop-shadow(0 -8px 24px rgba(0,0,0,0.5));
  }

  /* Pocket decorative emblem & text */
  .pocket-branding {
    position: absolute;
    left: 50%;
    bottom: 9%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 22;
    pointer-events: none;
  }
  .pocket-flower {
    width: 32px;
    height: 32px;
    margin: 0 auto 6px;
    opacity: 0.9;
  }
  .pocket-title {
    font-size: 11px;
    letter-spacing: 0.30em;
    color: #d4af72;
    margin-bottom: 3px;
    font-family: serif;
    opacity: 0.9;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  .pocket-subtitle {
    font-size: 9px;
    letter-spacing: 0.24em;
    color: #c5a065;
    opacity: 0.8;
    font-family: serif;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }

  /* 7. Wax Seal */
  .layer-wax-seal {
    left: 50%;
    top: 14%;
    width: 84px;
    height: 84px;
    transform: translateX(-50%);
    z-index: 25;
    pointer-events: none;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,0.65));
  }
</style>
</head>
<body>
  <div class="chapter-header">
    <div class="chapter-title">CHƯƠNG 02</div>
    <div class="chapter-star">✦</div>
  </div>

  <div class="envelope-scene">
    <!-- 2. Top flap -->
    <img class="layer layer-top-flap" src="http://localhost:3333/assets/envelope-voucher/02_envelope_top_flap.png" />

    <!-- 3. Ivory inner liner -->
    <img class="layer layer-inner-liner" src="http://localhost:3333/assets/envelope-voucher/04_envelope_inner_liner.png" />

    <!-- 4. Handwritten letter -->
    <img class="layer layer-letter" src="http://localhost:3333/assets/envelope-voucher/06_letter_note.png" />

    <!-- 5. Voucher fan -->
    <div class="voucher-group">
      <img class="voucher-card voucher-1" src="http://localhost:3333/assets/envelope-voucher/07_voucher_01_food.png" />
      <img class="voucher-card voucher-2" src="http://localhost:3333/assets/envelope-voucher/08_voucher_02_coffee.png" />
      <img class="voucher-card voucher-3" src="http://localhost:3333/assets/envelope-voucher/09_voucher_03_movie.png" />
      <img class="voucher-card voucher-4" src="http://localhost:3333/assets/envelope-voucher/10_voucher_04_anywhere.png" />
    </div>

    <!-- 6. Bottom burgundy pocket -->
    <img class="layer layer-bottom-pocket" src="http://localhost:3333/assets/envelope-voucher/03_envelope_bottom_pocket.png" />

    <!-- Pocket decorative gold flower + text -->
    <div class="pocket-branding">
      <svg class="pocket-flower" viewBox="0 0 24 24" fill="none" stroke="#d4af72" stroke-width="1.2">
        <path d="M12 3c-1.5 3-3.5 5-6 6 2.5 1 4.5 3 6 6 1.5-3 3.5-5 6-6-2.5-1-4.5-3-6-6z" />
        <path d="M12 9c-1 2-2 3-4 4 2 .8 3 1.8 4 4 1-2.2 2-3.2 4-4-2-1-3-2-4-4z" />
      </svg>
      <div class="pocket-title">NHỮNG ĐIỀU NHỎ BÉ</div>
      <div class="pocket-subtitle">CHO NGƯỜI THẬT ĐẶC BIỆT</div>
    </div>

    <!-- 7. Wax seal -->
    <img class="layer layer-wax-seal" src="http://localhost:3333/assets/envelope-voucher/05_wax_seal.png" />
  </div>
</body>
</html>
